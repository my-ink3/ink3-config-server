server:
  port: 10264

spring:
  application:
    name: config-server
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ink3
  cloud:
    bus:
      enabled: true
    config:
      server:
        git:
          uri: https://github.com/my-ink3/ink3-config.git
          clone-on-start: true
          default-label: main
          repos:
            auth:
              pattern:
                - 'auth-service'
              uri: https://github.com/my-ink3/ink3-config.git
              search-paths:
                - auth

            api:
              pattern:
                - 'shop-service'
              uri: https://github.com/my-ink3/ink3-config.git
              search-paths:
                - api

            eureka:
              pattern:
                - 'ink3-eureka'
              uri: https://github.com/my-ink3/ink3-config.git
              search-paths:
                - eureka

            batch:
              pattern:
                - 'ink3-batch'
              uri: https://github.com/my-ink3/ink3-config.git
              search-paths:
                - batch

            gateway:
              pattern:
                - 'ink3-gateway'
              uri: https://github.com/my-ink3/ink3-config.git
              search-paths:
                - gateway

            front:
              pattern:
                - 'ink3-front'
              uri: https://github.com/my-ink3/ink3-config.git
              search-paths:
                - front



management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
